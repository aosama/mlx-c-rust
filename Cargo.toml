[package]
name = "mlx-c-rust"
# Pre-release while the extracted bridge is in its shakedown period; the
# stable release lands once early adopters have exercised it. Pre-releases
# are never resolved by default dependency resolution, so nobody gets an
# early build accidentally.
version = "0.32.4-alpha.1"
edition = "2024"
# The crate version names the MLX RELEASE THE CRATE IS VERIFIED AGAINST —
# the number users search for and install (the scheme mlx-rs established for
# user-facing crates; only internal sys layers version by MLX-C). MLX-C is
# the carrier for the C bridge, not the pace-setter: this release binds the
# MLX-C v0.7.0 headers, carried forward to MLX v0.32.4 by this repository's
# reviewed bridge adaptations (the forward edit set in native_forward_edits.rs),
# until an MLX-C release pairs with that MLX. The bound pair is recorded
# here, in the README, and in COVERAGE_INVENTORY.md. Our own fixes ride as
# patch bumps; an MLX-C surface change within the same MLX release also
# rides as a patch bump with an inventory note.
rust-version = "1.101"
description = "A complete, low-level, policy-free Rust bridge to the MLX-C API of Apple's MLX for Apple silicon, tracking MLX releases. Version = the verified MLX release (0.32.4; carries MLX-C 0.7 forward)."
license = "MIT OR Apache-2.0"
repository = "https://github.com/aosama/mlx-c-rust"
documentation = "https://docs.rs/mlx-c-rust"
readme = "README.md"
keywords = ["mlx", "apple-silicon", "machine-learning", "bindings", "gpu"]
categories = ["api-bindings", "science"]
exclude = [
  "xtask",
  ".github",
  ".cargo",
  "rust-toolchain.toml",
  "vendor/mlx-c/README.md",
  "vendor/mlx-c/docs",
]

[lib]
name = "mlx_c_rust"

[lints.rust]
# This crate exists to encapsulate the one unsafe boundary in the workspace:
# every MLX-C extern call lives here behind owned handles and checked statuses.
unsafe_code = "allow"
unused_must_use = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }

[dependencies]
thiserror = "2"

[build-dependencies]
bindgen = "0.73"
pkg-config = "0.3"
# Verifies the pinned source tarballs of the automatic native build before
# compilation; pure Rust, no native build cost of its own.
sha2 = "0.11"

[package.metadata.docs.rs]
targets = ["aarch64-apple-darwin"]

# The repository tooling workspace: the root package is the published crate;
# xtask carries the typed build-native command (see .cargo/config.toml).
[workspace]
members = ["xtask"]
